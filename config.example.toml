[mailbox]
host = "imap.gmail.com"
username = "you@example.com"
password = "app-password"

[[mailbox.statements]]
name = "sbi_card_statement"

[[mailbox.statements.query]]
from_ = "ELITE.card@sbicard.com"
subject = "Your SBI Card ELITE Monthly Statement"
gmail_label = "Statement"

[[mailbox.statements.transaction_patterns]]
name = "sbi_card"
regex = "(?P<currency>Rs\\.|₹)\\s*(?P<amount>[\\d,]+(?:\\.\\d+)?)\\s*spent on your\\s+SBI Credit Card\\s+ending with\\s+(?P<card_last4>\\d{4})\\s+at\\s+(?P<merchant>.+?)\\s+on\\s+(?P<date>\\d{1,2}-\\d{1,2}-\\d{2,4})\\s+via\\s+(?P<channel>.+?)\\s*\\(Ref No\\.\\s*(?P<reference_no>\\d+)\\)"
flags = ["IGNORECASE"]

[[mailbox.statements]]
name = "hdfc_statement"

[[mailbox.statements.query]]
from_ = "alerts@hdfcbank.bank.in"
subject = "You have done a UPI txn. Check details!"

[[mailbox.statements.transaction_patterns]]
name = "hdfc_card"
regex = "(?P<currency>Rs\\.|₹)\\s*(?P<amount>[\\d,]+(?:\\.\\d+)?)\\s+is debited from your account ending\\s+(?P<card_last4>\\d{4})\\s+towards(?:\\s+VPA)?\\s+(?P<vpa>[^\\s]+)\\s+\\((?P<merchant>[^)]+)\\)\\s+on\\s+(?P<date>\\d{1,2}-\\d{1,2}-\\d{2,4})\\.\\s*(?P<channel>UPI)\\s+transaction reference no\\.\\s*:\\s*(?P<reference_no>\\d+)\\."
field_mapping = { amount = "amount", merchant = "merchant", card_last4 = "card_last4", transaction_date = "date", reference_no = "reference_no", channel = "channel", currency = "currency", vpa = "vpa" }
flags = ["IGNORECASE"]

[fetch]
reverse = true
limit = 15